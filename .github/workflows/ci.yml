name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE: "1"
  # Credenciais descartáveis do PostgreSQL efêmero da CI.
  POSTGRES_USER: postgres
  PGPASSWORD: ci-superuser
  PGHOST: localhost
  LOCENTRA_OWNER_PASSWORD: ci-owner
  LOCENTRA_APP_PASSWORD: ci-app
  LOCENTRA_WORKER_PASSWORD: ci-worker

jobs:
  analise:
    name: Análise estática e dependências
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Verificar lockfile congelado
        run: bundle config set --local frozen true && bundle check
      - name: RuboCop
        run: bundle exec rubocop
      - name: Bundler Audit
        run: bundle exec bundle-audit check --update
      - name: Actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  segredos:
    name: Verificação de segredos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --config /repo/.gitleaks.toml

  unitarios:
    name: Testes unitários
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Suíte unitária (sem banco, rede ou servidor)
        run: bundle exec rake test:unit TESTOPTS="--verbose"

  integracao:
    name: Testes com PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_MIGRATION_DATABASE_URL: postgres://locentra_owner:ci-owner@localhost:5432/locentra_test
      TEST_DATABASE_URL: postgres://locentra_app:ci-app@localhost:5432/locentra_test
      TEST_WORKER_DATABASE_URL: postgres://locentra_worker:ci-worker@localhost:5432/locentra_test
      COVERAGE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Criar papéis e bancos (mesmo script do ambiente local)
        run: sh docker/postgres/init/01-roles.sh
      - name: Suítes unitária, repositórios, integração, Rack, CLI e concorrência com metas de cobertura
        run: bundle exec rake test:all TESTOPTS="--verbose"
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  navegador:
    name: Testes de navegador
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_MIGRATION_DATABASE_URL: postgres://locentra_owner:ci-owner@localhost:5432/locentra_test
      TEST_DATABASE_URL: postgres://locentra_app:ci-app@localhost:5432/locentra_test
      TEST_WORKER_DATABASE_URL: postgres://locentra_worker:ci-worker@localhost:5432/locentra_test
      # Chrome já instalado na imagem do runner; Ferrum o executa em modo headless e sem sandbox.
      BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Criar papéis e bancos (mesmo script do ambiente local)
        run: sh docker/postgres/init/01-roles.sh
      - name: Versão do navegador
        run: '"$BROWSER_PATH" --version'
      - name: Suíte de navegador (Puma em processo, Chrome headless via Ferrum)
        run: bundle exec rake test:browser TESTOPTS="--verbose"

  banco:
    name: Reconstrução do banco e seed
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: development
      MIGRATION_DATABASE_URL: postgres://locentra_owner:ci-owner@localhost:5432/locentra
      DATABASE_URL: postgres://locentra_app:ci-app@localhost:5432/locentra
      WORKER_DATABASE_URL: postgres://locentra_worker:ci-worker@localhost:5432/locentra
      APP_SECRET_KEY_BASE: ci-secret-key-base-0123456789abcdef0123456789abcdef
      APP_ENCRYPTION_KEY: ci-encryption-key-0123456789abcdef
      BCRYPT_COST: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Criar papéis e bancos
        run: sh docker/postgres/init/01-roles.sh
      - name: Migrations a partir do banco vazio
        run: ruby bin/locentra-admin db:migrate
      - name: Status sem divergências e reexecução sem pendências
        run: |
          ruby bin/locentra-admin db:status
          ruby bin/locentra-admin db:migrate | grep -q "Nenhuma migration pendente"
      - name: Seed idempotente (duas execuções)
        run: |
          ruby bin/locentra-admin db:seed --json
          test "$(ruby bin/locentra-admin db:seed --json | grep -c '"skipped": true')" = "2"

  imagem:
    name: Build e análise da imagem
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build da imagem de execução
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: locentra:ci
      - name: Trivy (vulnerabilidades corrigíveis HIGH/CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln locentra:ci
      - name: Imagem inicia sem conexões e responde liveness
        run: |
          docker run -d --name web -p 9292:9292 -e APP_ENV=production -e APP_BASE_URL=https://locentra.example \
            -e DATABASE_URL=postgres://ninguem@127.0.0.1:1/nada -e APP_SECRET_KEY_BASE=ci-secret-key-base-0123456789abcdef0123456789 \
            -e APP_ENCRYPTION_KEY=ci-encryption-key-0123456789 locentra:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:9292/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:9292/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/health/ready)" = "503"
