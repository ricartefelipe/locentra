name: Publicação da imagem

# Publica a imagem somente para tags de versão (vX.Y.Z), depois de repetir as verificações, e somente quando
# a publicação estiver habilitada explicitamente na variável de repositório PUBLISH_IMAGE=true.
# Não há deploy automático: a implantação usa a imagem publicada e os runbooks.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verificacoes:
    name: Verificações da versão
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_USER: postgres
      PGPASSWORD: ci-superuser
      PGHOST: localhost
      LOCENTRA_OWNER_PASSWORD: ci-owner
      LOCENTRA_APP_PASSWORD: ci-app
      LOCENTRA_WORKER_PASSWORD: ci-worker
      APP_ENV: test
      COVERAGE_CHECK: "1"
      TEST_MIGRATION_DATABASE_URL: postgres://locentra_owner:ci-owner@localhost:5432/locentra_test
      TEST_DATABASE_URL: postgres://locentra_app:ci-app@localhost:5432/locentra_test
      TEST_WORKER_DATABASE_URL: postgres://locentra_worker:ci-worker@localhost:5432/locentra_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - name: Versão da tag corresponde a Locentra::VERSION
        run: test "v$(ruby -Ilib -e 'require "locentra/version"; print Locentra::VERSION')" = "${GITHUB_REF_NAME}"
      - run: bundle exec rubocop
      - run: bundle exec bundle-audit check --update
      - run: sh docker/postgres/init/01-roles.sh
      - run: bundle exec rake test:all

  publicar:
    name: Publicar imagem no GHCR
    needs: verificacoes
    if: vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - name: Build e análise antes da publicação
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: locentra:verificacao
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln locentra:verificacao
      - name: Publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
