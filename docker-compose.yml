name: locentra

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:9292}
  APP_SECRET_KEY_BASE: ${APP_SECRET_KEY_BASE:?defina APP_SECRET_KEY_BASE no .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?defina APP_ENCRYPTION_KEY no .env}
  APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
  DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?defina WORKER_DATABASE_URL no .env}
  PUMA_THREADS: ${PUMA_THREADS:-5}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-0}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  WEBHOOK_CONCURRENCY: ${WEBHOOK_CONCURRENCY:-4}
  WEBHOOK_MAX_PER_ORGANIZATION: ${WEBHOOK_MAX_PER_ORGANIZATION:-2}
  OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
  WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
  INBOUND_WEBHOOK_RETENTION_DAYS: ${INBOUND_WEBHOOK_RETENTION_DAYS:-90}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  API_RATE_LIMIT: ${API_RATE_LIMIT:-1200}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_TLS: ${SMTP_TLS:-none}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTH: ${SMTP_AUTH:-plain}
  MAIL_FROM: ${MAIL_FROM:-Locentra <nao-responda@locentra.local>}
  PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-}
  ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
  STORAGE_ROOT: /app/storage
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  METRICS_TOKEN: ${METRICS_TOKEN:-}

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      LOCENTRA_OWNER_PASSWORD: ${LOCENTRA_OWNER_PASSWORD:?defina LOCENTRA_OWNER_PASSWORD}
      LOCENTRA_APP_PASSWORD: ${LOCENTRA_APP_PASSWORD:?defina LOCENTRA_APP_PASSWORD}
      LOCENTRA_WORKER_PASSWORD: ${LOCENTRA_WORKER_PASSWORD:?defina LOCENTRA_WORKER_PASSWORD}
      LOCENTRA_BACKUP_PASSWORD: ${LOCENTRA_BACKUP_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d locentra"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    image: locentra:local
    command: ["ruby", "bin/locentra-admin", "db:migrate"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?defina MIGRATION_DATABASE_URL no .env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["ops"]

  web:
    image: locentra:local
    build:
      context: .
      target: runtime
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment: *app-env
    ports:
      - "127.0.0.1:9292:9292"
    volumes:
      - storage:/app/storage
    # Acima dos 25 s de encerramento gracioso do Puma (worker_shutdown_timeout).
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    image: locentra:local
    command: ["ruby", "bin/worker"]
    environment: *app-env
    volumes:
      - storage:/app/storage
    # O worker não serve HTTP: o healthcheck da imagem (liveness do web) é substituído pelo arquivo de
    # vida atualizado pela thread de heartbeat.
    healthcheck:
      test: ["CMD", "ruby", "bin/worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Acima dos 25 s que o Runner espera as tarefas em execução ao receber TERM.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  dev:
    build:
      context: .
      target: dev
    image: locentra-dev:local
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      TEST_MIGRATION_DATABASE_URL: ${TEST_MIGRATION_DATABASE_URL}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      TEST_WORKER_DATABASE_URL: ${TEST_WORKER_DATABASE_URL}
      APP_ENV: test
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dev"]

volumes:
  pgdata:
  storage:
