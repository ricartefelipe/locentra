openapi: 3.1.0
info:
  title: Locentra API
  version: "1.2"
  description: |
    API versionada do Locentra. Autenticação por credencial de integração (`Authorization: Bearer lcn_...`)
    com escopos por permissão. O tenant é determinado pela credencial, nunca por parâmetros.

    Instantes usam ISO 8601 com offset; períodos são semiabertos `[starts_at, ends_at)`.
    Valores monetários são objetos `Money` com centavos inteiros.

    Operações de reserva e financeiras exigem `Idempotency-Key`. A mesma chave com o mesmo conteúdo
    devolve o resultado gravado (cabeçalho `Idempotent-Replayed: true`); com conteúdo diferente, `409`.
    Operações de condições comerciais (POST e PATCH) também exigem `Idempotency-Key`.

    Nas condições comerciais (cupons, tarifas adicionais e condições negociadas), percentuais são inteiros
    em pontos-base (`800` = 8%) e valores são centavos inteiros: números com casas decimais e números
    enviados como texto são recusados com `422`. As alterações usam o identificador do recurso; as consultas
    de cupom e de tarifa aceitam também o código. Os erros de validação vêm em `error.details.fields`, com os
    nomes de campo das regras de negócio (por exemplo `codigo`, `valor`, `valido_ate`, `maximo_usos`,
    `subtotal_minimo`, `desconto`, `motivo`, `encerrar_em`, `valor_padrao`, `tarifas`).

    A organização do token (configurações e filiais) é consultada em `GET /organization`, com o escopo
    `organization.read`. Credenciais criadas antes da versão 1.2 não recebem `organization.read`: é preciso
    criar outra credencial com o escopo. A alteração das configurações é feita por sessão de usuário com
    `organization.manage` (cookie de sessão + `X-CSRF-Token`) em `PATCH /organization/settings`; credenciais
    recebem 403, mesmo com o escopo (ADR-029). As filiais não são geridas pela API.

    Orçamentos (`/quotes`, escopos `quotes.read` e `quotes.write`; a conversão exige também
    `reservations.write`), contratos (`/contracts`, escopos `contracts.read` e `contracts.write`; o aditivo exige
    também `reservations.write` e o cancelamento, `reservations.cancel`), retirada e devolução
    (`/reservations/{id}/pickups`, `/pickups`, `/reservations/{id}/returns`, `/returns`, escopo
    `fulfillment.write`), inspeções (`/inspections`, escopo `inspections.write`) e alertas (`/alerts`, escopo
    `fulfillment.write`) são lidos com os escopos de leitura indicados em cada operação (`reservations.read` na
    operação). Toda mutação exige `Idempotency-Key`, roda na mesma transação da chave e devolve o recurso
    atualizado. A criação que pode encontrar o recurso existente (emissão de contrato, separação e conversão de
    orçamento) responde `201` quando cria e `200` quando devolve o existente, com `Location` nos dois casos.
    Credenciais não aplicam desconto manual. Os detalhes trazem o cliente pelo identificador, sem nome nem
    documento. Portal do cliente, aceite e encerramento de contrato, avarias, manutenção e transferências não
    estão na API.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /organization:
    get:
      summary: Organização do token com configurações e filiais
      description: >-
        Escopo `organization.read`. A organização é sempre a da credencial. `settings` traz a validade padrão do
        bloqueio temporário (usada quando `hold_minutes` não é informado na criação de reserva), a política de
        cancelamento vigente para reservas e versões de orçamento novas e o texto de cada faixa. Os indicadores
        `*_default` comparam o valor com o padrão do sistema. As filiais incluem as inativas, com `active` e
        `deactivated_at`. A alteração é feita em `PATCH /organization/settings`, somente por sessão de usuário.
      operationId: getOrganization
      responses:
        "200":
          description: Organização
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /organization/settings:
    patch:
      summary: Altera as configurações da organização (somente sessão de usuário)
      description: >-
        Permissão `organization.manage` de um usuário autenticado por sessão (cookie de sessão e `X-CSRF-Token`, o token
        `_csrf` das páginas da interface). Credenciais recebem `403` `forbidden`, mesmo com o escopo
        `organization.manage` (ADR-029). PATCH parcial: chave presente altera o campo e chave ausente mantém o valor
        atual; sem `cancellation_policy`, a política gravada é mantida como está, sem revalidação. `lock_version` é obrigatório e precisa ser a versão atual (`409` `stale_organization`). A troca de fuso
        exige `confirm_time_zone_change: true` (`422` em `confirmar_fuso`). A política usa o formato de `GET
        /organization`, com as mesmas regras e mensagens da interface em `faixas_cancelamento`. Chave desconhecida ou
        não editável (`slug`, `status`, `settings`, `branches`...) responde `422` no próprio nome da chave. Sem mudança
        efetiva, `200` com `changed: false` e sem auditoria; com mudança, a auditoria registra `via: api`.
      operationId: updateOrganizationSettings
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationSettingsPatch" }
      responses:
        "200":
          description: Configurações após a operação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettingsResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /availability:
    get:
      summary: Disponibilidade por período
      operationId: getAvailability
      parameters:
        - { name: branch_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: starts_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: ends_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: product_ids, in: query, required: false, description: Lista separada por vírgulas, schema: { type: string } }
      responses:
        "200":
          description: Unidades disponíveis (pico de ocupação simultânea descontado da capacidade)
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { $ref: "#/components/schemas/Period" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string, format: uuid }
                        sku: { type: string }
                        tracking: { type: string, enum: [serialized, bulk, kit] }
                        available: { type: integer }
                        total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /customers:
    get:
      summary: Lista clientes
      operationId: listCustomers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, blocked, inactive] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, created_at, -created_at] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de clientes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPage" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cadastra cliente
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, document]
              properties:
                kind: { type: string, enum: [individual, company] }
                name: { type: string }
                trade_name: { type: string }
                document: { type: string, description: CPF ou CNPJ com dígitos verificadores válidos }
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /customers/{id}:
    get:
      summary: Detalha cliente
      operationId: getCustomer
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/Error" }
  /products:
    get:
      summary: Lista produtos e kits
      operationId: listProducts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: tracking, in: query, schema: { type: string, enum: [serialized, bulk, kit] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Product" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "422": { $ref: "#/components/responses/Error" }
  /reservations:
    get:
      summary: Lista reservas
      operationId: listReservations
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, held, confirmed, in_progress, completed, cancelled, expired] } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [starts_at, -starts_at, created_at, -created_at, code] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de reservas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Reservation" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cria reserva (solicitação, bloqueio temporário ou confirmação imediata)
      description: >-
        Escopo `reservations.write`. `coupon_code` aplica um cupom vigente (o uso é registrado para a reserva e
        liberado se ela for cancelada ou expirar). `fees` aplica tarifas adicionais: tarifa do catálogo pelo valor
        padrão não exige outro escopo; valor diferente do padrão e tarifa avulsa exigem `fees.override` (`403`).
        Credenciais não reduzem tarifas abaixo do valor padrão. As condições negociadas vigentes do cliente são
        aplicadas automaticamente. Sem `hold_minutes`, o bloqueio usa a validade padrão da organização. A reserva
        guarda a política de cancelamento vigente na criação. Filial inexistente responde `404` ("filial não
        encontrada"); filial inativa responde `422` com `filial` em `error.details.fields` ("filial inativa:
        escolha uma filial ativa").
      operationId: createReservation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, branch_id, starts_at, ends_at, items]
              properties:
                customer_id: { type: string, format: uuid }
                branch_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                mode:
                  type: string
                  enum: [request, hold, confirm]
                  default: hold
                  description: "request não garante disponibilidade; hold bloqueia até expirar; confirm aloca e confirma."
                hold_minutes: { type: integer, minimum: 5, maximum: 1440 }
                coupon_code: { type: string, description: Código do cupom (maiúsculas e minúsculas são equivalentes) }
                fees:
                  type: array
                  maxItems: 10
                  description: Tarifas adicionais; a mesma tarifa do catálogo não se repete
                  items: { $ref: "#/components/schemas/ReservationFee" }
                notes: { type: string }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Reserva criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /reservations/{id}:
    get:
      summary: Detalha reserva com itens, alocações e preços congelados
      operationId: getReservation
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Reserva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/Error" }
  /reservations/{id}/confirm:
    post:
      summary: Confirma reserva revalidando a disponibilidade atomicamente
      description: >-
        O bloqueio temporário criado no envio de um orçamento é confirmado somente pela conversão do
        orçamento aprovado; a confirmação direta responde 409 com o código `quote_hold`.
      operationId: confirmReservation
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409": { $ref: "#/components/responses/Error" }
  /reservations/{id}/cancel:
    post:
      summary: Cancela reserva e libera as alocações
      description: >-
        Reserva com contrato em aberto é cancelada somente pelo contrato, que aplica a política de
        cancelamento; o cancelamento direto responde 409 com o código `contract_amendment_required`.
      operationId: cancelReservation
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Reserva cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "409": { $ref: "#/components/responses/Error" }
  /quotes:
    get:
      summary: Lista orçamentos
      description: >-
        Escopo `quotes.read`. Filtros por situação, cliente e busca no código ou no nome do cliente (`q`). Cada linha
        traz a validade, o período e o total da versão atual.
      operationId: listQuotes
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, sent, approved, rejected, expired, converted] } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 } }
        - { name: sort, in: query, schema: { type: string, enum: [-created_at, created_at, code], default: -created_at } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de orçamentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotePage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cria orçamento em rascunho (versão 1)
      description: >-
        Escopo `quotes.write`. A versão é precificada com o catálogo vigente (sem cupom) e congela a política de
        cancelamento atual. Tarifas (`fees`) seguem as regras da criação de reserva: valor diferente do padrão e tarifa
        avulsa exigem `fees.override` (`403`). Credenciais não aplicam desconto manual (`manual_discount_bps` acima de
        0 responde `403`). Responde `201` com o detalhe e `Location` do orçamento. Os erros de formato vêm reunidos em
        `error.details.fields` (`validade`, `itens`, `tarifas`, `desconto`, `condicoes`, `politica_bloqueio`,
        `validade_bloqueio`, `cliente`, `filial`).
      operationId: createQuote
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: Orçamento criado
          headers:
            Location: { description: Endereço do orçamento, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /quotes/{id}:
    get:
      summary: Detalha orçamento com todas as versões
      description: Escopo `quotes.read`. O cliente aparece pelo identificador.
      operationId: getQuote
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Orçamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /quotes/{id}/versions:
    post:
      summary: Cria nova versão do orçamento
      description: >-
        Escopo `quotes.write`. Exige o conteúdo completo da versão (como o formulário pré-preenchido); o cliente não
        muda (`customer_id` no corpo responde `422` em `cliente`). Sem diferença em relação à versão atual, `422` em
        `base`. O orçamento volta a rascunho e o bloqueio temporário do envio anterior é liberado. Responde `201` com o
        detalhe.
      operationId: reviseQuote
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRevisionInput" }
      responses:
        "201":
          description: Nova versão criada
          headers:
            Location: { description: Endereço do orçamento, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /quotes/{id}/send:
    post:
      summary: Envia a versão atual ao cliente
      description: >-
        Escopo `quotes.write`. Com `hold_policy` `hold_on_send`, cria na mesma transação a reserva de bloqueio temporário
        (exige também `reservations.write`); sem disponibilidade, `409` `unavailable` com `shortages`. Com `none`, o envio
        não garante disponibilidade. Orçamento fora de rascunho responde `409` `invalid_transition`.
      operationId: sendQuote
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Orçamento enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /quotes/{id}/approve:
    post:
      summary: Registra a aprovação em nome do cliente
      description: >-
        Escopo `quotes.write`. `version` é a versão exibida ao cliente: versão desatualizada responde `409`
        `stale_quote_version`. Orçamento com a validade vencida responde `409` `quote_expired` e passa a `expired` (a
        expiração é registrada à parte, sem aprovar; repetir a mesma chave não aprova). A aprovação registra
        `approved_by_type: staff` e o nome informado.
      operationId: approveQuote
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteApproval" }
      responses:
        "200":
          description: Orçamento aprovado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /quotes/{id}/reject:
    post:
      summary: Registra a rejeição da versão atual
      description: >-
        Escopo `quotes.write`. `version`, quando informada, precisa ser a atual (`409` `stale_quote_version`). Libera o
        bloqueio temporário do envio.
      operationId: rejectQuote
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRejection" }
      responses:
        "200":
          description: Orçamento rejeitado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /quotes/{id}/convert:
    post:
      summary: Converte o orçamento aprovado em reserva confirmada
      description: >-
        Escopos `quotes.write` e `reservations.write`. A reserva usa o snapshot de preços da versão aprovada; com
        bloqueio temporário vigente, a própria reserva bloqueada é confirmada. Responde `201` quando cria a reserva e
        `200` quando o orçamento já estava convertido (a mesma reserva), com `Location` da reserva nos dois casos. Sem
        disponibilidade, `409` `unavailable`; bloqueio divergente da versão, `409` `quote_hold_mismatch`; orçamento fora
        de aprovado, `409` `invalid_transition`.
      operationId: convertQuote
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Orçamento já convertido
          headers:
            Location: { description: Endereço da reserva, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteConversion" }
        "201":
          description: Reserva criada pela conversão
          headers:
            Location: { description: Endereço da reserva, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteConversion" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contracts:
    get:
      summary: Lista contratos
      description: Escopo `contracts.read`. Filtros por situação, cliente e busca no código do contrato, da reserva ou no nome do cliente (`q`).
      operationId: listContracts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [issued, active, closed, cancelled] } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de contratos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Emite o contrato da reserva confirmada
      description: >-
        Escopo `contracts.write`. Congela os termos (cliente, itens, preços, política de cancelamento e fuso da
        reserva) e gera a versão 1 do documento em PDF. Responde `201` quando emite e `200` quando a reserva já tinha
        contrato (o mesmo), com `Location` do contrato nos dois casos. Reserva que não está confirmada nem em andamento
        responde `409` `reservation_not_confirmed`.
      operationId: issueContract
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractIssueInput" }
      responses:
        "200":
          description: Contrato já emitido para a reserva
          headers:
            Location: { description: Endereço do contrato, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "201":
          description: Contrato emitido
          headers:
            Location: { description: Endereço do contrato, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contracts/{id}:
    get:
      summary: Detalha contrato com documentos, aditivos e prévia de cancelamento
      description: >-
        Escopo `contracts.read`. `cancellation_preview` traz a multa no instante atual enquanto o contrato pode ser
        cancelado (antes da retirada); depois, é nula.
      operationId: getContract
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Contrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contracts/{id}/documents/{version}:
    get:
      summary: PDF de uma versão do documento do contrato
      description: >-
        Escopo `contracts.read`. O arquivo vem como anexo (`Content-Disposition: attachment`) com o nome
        `contrato-<código>-v<versão>.pdf`, sem cache e com `Repr-Digest` (RFC 9530) com o SHA-256 gravado na geração,
        para conferência de integridade. Versão inexistente ou conteúdo ausente no armazenamento respondem `404`;
        versão que não é inteiro positivo, `422` em `versao`.
      operationId: getContractDocument
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Documento em PDF
          headers:
            Content-Disposition: { description: "attachment; filename=\"contrato-C-000001-v1.pdf\"; filename*=UTF-8''...", schema: { type: string } }
            Cache-Control: { description: "private, no-store", schema: { type: string } }
            Repr-Digest: { description: "sha-256=:<SHA-256 em base64>:", schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contracts/{id}/amendments:
    post:
      summary: Registra aditivo de extensão do prazo
      description: >-
        Escopos `contracts.write` e `reservations.write`. Estende a reserva na mesma transação (a diferença de valor é
        gravada como ajuste), registra o aditivo e gera nova versão do documento. Extensão que invade outra reserva
        responde `409` `unavailable` com `shortages`, sem aditivo. Contrato encerrado ou cancelado responde `409`
        `invalid_transition`.
      operationId: amendContract
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractAmendmentInput" }
      responses:
        "201":
          description: Aditivo registrado
          headers:
            Location: { description: Endereço do contrato, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractAmendmentResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /contracts/{id}/cancel:
    post:
      summary: Cancela o contrato com a política de cancelamento congelada
      description: >-
        Escopos `contracts.write` e `reservations.cancel`. A multa é a da faixa da política do contrato aplicada ao
        total contratado (com os aditivos), gravada como ajuste da reserva quando positiva; a reserva é cancelada na
        mesma transação. Depois da retirada, `409` `contract_not_cancellable`.
      operationId: cancelContract
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Contrato cancelado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractCancellationResult" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /reservations/{id}/pickups:
    post:
      summary: Inicia a separação da retirada
      description: >-
        Escopo `fulfillment.write`. Cria uma linha por alocação ativa da reserva confirmada. Responde `201` quando cria a
        separação e `200` quando já havia separação em andamento (a mesma), com `Location` da retirada. Reserva fora de
        confirmada responde `409` `invalid_transition`; sem alocações ativas, `422` em `reserva`.
      operationId: startPickup
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Separação em andamento
          headers:
            Location: { description: Endereço da retirada, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pickup" }
        "201":
          description: Separação criada
          headers:
            Location: { description: Endereço da retirada, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pickup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /reservations/{id}/return-items:
    get:
      summary: Itens entregues e pendentes de devolução da reserva
      description: Escopo `reservations.read`. Linhas da retirada entregue com a quantidade pendente e as devoluções já registradas.
      operationId: getReturnItems
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Itens da devolução
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnItems" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /reservations/{id}/returns:
    post:
      summary: Registra devolução total ou parcial
      description: >-
        Escopo `fulfillment.write`. Cada item informa o resultado (`ok`, `damaged` ou `missing`), a quantidade (padrão 1;
        ativo individual é devolvido por unidade), se exige inspeção e observações (obrigatórias em avaria e falta).
        Avaria sempre exige inspeção; falta nunca passa por inspeção. A devolução que conclui todos os itens encerra a
        reserva. Item já devolvido responde `409` `already_returned`; reserva fora de andamento, `409`
        `invalid_transition`. Responde `201` com o detalhe e `Location` da devolução.
      operationId: createReturn
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnInput" }
      responses:
        "201":
          description: Devolução registrada
          headers:
            Location: { description: Endereço da devolução, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /pickups/{id}:
    get:
      summary: Detalha a retirada com as linhas
      description: >-
        Escopo `reservations.read`. `authorized_pickers` (contatos autorizados a retirar) vem somente com `customers.read`;
        sem o escopo, é nulo. O documento do retirante não é exposto.
      operationId: getPickup
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Retirada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pickup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /pickups/{id}/check:
    post:
      summary: Confere os itens da separação
      description: >-
        Escopo `fulfillment.write`. Ativos são conferidos pelo patrimônio (`tag`; outra unidade livre do mesmo produto
        substitui a alocada) e estoque pela quantidade (`quantity`, inteiro). Os erros de todos os itens são reunidos (por
        exemplo, `patrimonio` e `quantidade`). Retirada já entregue responde `409` `already_picked_up`.
      operationId: checkPickup
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PickupCheckInput" }
      responses:
        "200":
          description: Conferência registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pickup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /pickups/{id}/deliver:
    post:
      summary: Entrega os itens conferidos
      description: >-
        Escopo `fulfillment.write`. Somente itens conferidos são entregues; os demais têm a alocação liberada. A reserva
        passa a em andamento. Sem item conferido, `422` em `itens`; retirante inválido, `422` em `retirante`; retirada já
        entregue, `409` `already_picked_up`.
      operationId: deliverPickup
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PickupDeliverInput" }
      responses:
        "200":
          description: Retirada entregue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pickup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /pickups/{id}/cancel:
    post:
      summary: Cancela a separação em andamento
      description: Escopo `fulfillment.write`. A reserva continua confirmada. Retirada já entregue responde `409` `already_picked_up`.
      operationId: cancelPickup
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Separação cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pickup" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /returns/{id}:
    get:
      summary: Detalha a devolução
      description: Escopo `reservations.read`. Itens com resultado, registro de avaria ou falta e multas por atraso.
      operationId: getReturn
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Devolução
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /inspections:
    get:
      summary: Lista inspeções pendentes ou decididas
      description: Escopo `reservations.read`. Pendentes da mais recente para a mais antiga; decididas pela decisão mais recente.
      operationId: listInspections
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, decided], default: pending } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de inspeções
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /inspections/{id}/approve:
    post:
      summary: Aprova a inspeção e libera o item
      description: >-
        Escopo `inspections.write`. O ativo volta a disponível; o bloqueio de estoque é encerrado. Inspeção já decidida
        responde `409` `invalid_transition`.
      operationId: approveInspection
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: [string, "null"], maxLength: 1000 }
      responses:
        "200":
          description: Inspeção aprovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /inspections/{id}/reject:
    post:
      summary: Reprova a inspeção e abre ordem de manutenção
      description: >-
        Escopo `inspections.write`. O item continua indisponível; reservas futuras do ativo são realocadas e as que
        ficarem sem unidade recebem alerta. `notes` (motivo) é obrigatório. Inspeção já decidida responde `409`
        `invalid_transition`.
      operationId: rejectInspection
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes: { type: string, maxLength: 1000, description: Motivo da reprovação }
                description: { type: [string, "null"], description: "Descrição da ordem de manutenção; sem ela, vale o motivo" }
      responses:
        "200":
          description: Inspeção reprovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionRejection" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /alerts:
    get:
      summary: Lista alertas operacionais
      description: >-
        Escopo `reservations.read`. Filtros por situação, tipo e reserva (a própria ou a relacionada, como a reserva em
        atraso que afeta outra). Mais recentes primeiro.
      operationId: listAlerts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved], default: open } }
        - { name: kind, in: query, schema: { type: string, enum: [overdue, affected_by_overdue, asset_unavailable] } }
        - { name: reservation_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de alertas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /alerts/{id}/resolve:
    post:
      summary: Resolve o alerta registrando a decisão
      description: >-
        Escopo `fulfillment.write`. Nenhuma reserva é cancelada automaticamente: a decisão fica registrada em
        `resolution` (de 3 a 1000 caracteres; erro em `decisao`). Alerta já resolvido responde `409`
        `alert_resolved`, também na resolução concorrente.
      operationId: resolveAlert
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200":
          description: Alerta resolvido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /payments:
    post:
      summary: Registra pagamento recebido fora do provedor (manual), confirmado na hora
      description: |
        Informe `receivable_id` (cobrança, escopo `finance.write`) ou `deposit_id` (caução, escopo `deposits.manage`).
        O valor não pode exceder o saldo em aberto da cobrança ou o restante previsto da caução. Pagamento de reserva
        expirada ou cancelada é confirmado com `requires_review: true` e gera alerta; a reserva não é reativada.
      operationId: createPayment
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount_cents]
              properties:
                receivable_id: { type: string, format: uuid }
                deposit_id: { type: string, format: uuid }
                method: { type: string, enum: [pix, boleto, card, cash, transfer] }
                amount_cents: { type: integer, minimum: 1, description: Centavos inteiros (valores decimais são recusados) }
                paid_at: { type: string, format: date-time, description: Instante do recebimento; padrão é o instante atual }
                notes: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Pagamento confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /payments/{id}:
    get:
      summary: Detalha pagamento com reembolsos e saldo reembolsável
      operationId: getPayment
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Pagamento
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Payment" }
                  - type: object
                    properties:
                      refunds: { type: array, items: { $ref: "#/components/schemas/Refund" } }
                      refundable: { $ref: "#/components/schemas/Money" }
        "404": { $ref: "#/components/responses/Error" }
  /payments/{id}/refunds:
    post:
      summary: Reembolsa pagamento de cobrança
      description: |
        O pagamento é bloqueado e a soma dos reembolsos pendentes e confirmados não pode exceder o valor confirmado
        (`409 refund_exceeds_eligible`). Pagamentos manuais têm o reembolso confirmado na hora; pagamentos de provedor
        ficam `pending` até o estorno ser concluído pelo worker. Escopo `finance.refund`.
      operationId: createRefund
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_cents, reason]
              properties:
                amount_cents: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201":
          description: Reembolso registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /coupons:
    get:
      summary: Lista cupons com a situação no instante da consulta
      description: Escopo `coupons.read`. A busca considera o início do código e qualquer trecho da descrição.
      operationId: listCoupons
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, scheduled, expired, exhausted, inactive] } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 } }
        - { name: sort, in: query, schema: { type: string, enum: [code, -created_at, valid_until], default: code } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de cupons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cadastra cupom
      description: >-
        Escopo `coupons.write`. O código é convertido para maiúsculas e é único na organização, inclusive entre
        cupons desativados (`409 coupon_code_taken`). Código, tipo e desconto não mudam depois do cadastro.
      operationId: createCoupon
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponInput" }
      responses:
        "201":
          description: Cupom cadastrado
          headers:
            Location: { description: Endereço do cupom (pelo identificador), schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /coupons/{id}:
    get:
      summary: Detalha cupom pelo identificador ou pelo código
      operationId: getCoupon
      parameters: [{ $ref: "#/components/parameters/Reference" }]
      responses:
        "200":
          description: Cupom
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Altera os campos editáveis do cupom
      description: >-
        Escopo `coupons.write`. Somente as chaves presentes são alteradas; `null` limpa o campo (em
        `min_subtotal_cents`, vale 0). Alteração sem mudança devolve o cupom como está, sem registro de auditoria.
        Com `lock_version` informado e diferente do atual, responde `409 stale_coupon`. `code`, `kind`,
        `discount_bps` e `discount_cents` não são aceitos. A rota exige o identificador (o código responde 422).
      operationId: updateCoupon
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponPatch" }
      responses:
        "200":
          description: Cupom atualizado (ou inalterado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /coupons/{id}/deactivate:
    post:
      summary: Desativa cupom
      description: >-
        Escopo `coupons.write`. Reservas já registradas não mudam. Cupom já desativado é devolvido como está.
        Não há exclusão pela API.
      operationId: deactivateCoupon
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Cupom desativado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /coupons/{id}/reactivate:
    post:
      summary: Reativa cupom
      description: Escopo `coupons.write`. Cupom já ativo é devolvido como está.
      operationId: reactivateCoupon
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Cupom reativado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /coupons/{id}/redemptions:
    get:
      summary: Lista os usos do cupom, mais recentes primeiro
      description: >-
        Escopo `coupons.read`. Cada uso pertence a uma reserva e o estado é derivado da situação dela: o uso é
        liberado quando a reserva é cancelada ou o bloqueio temporário expira.
      operationId: listCouponRedemptions
      parameters:
        - { $ref: "#/components/parameters/Reference" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de usos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponRedemptionPage" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /fees:
    get:
      summary: Lista as tarifas adicionais do catálogo
      description: Escopo `fees.read`. A busca considera o código e o nome.
      operationId: listFees
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, code, -created_at], default: name } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de tarifas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePage" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cadastra tarifa adicional
      description: Escopo `fees.write`. O código é único na organização (`409 fee_code_taken`) e não muda depois do cadastro.
      operationId: createFee
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeInput" }
      responses:
        "201":
          description: Tarifa cadastrada
          headers:
            Location: { description: Endereço da tarifa (pelo identificador), schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /fees/{id}:
    get:
      summary: Detalha tarifa pelo identificador ou pelo código
      operationId: getFee
      parameters: [{ $ref: "#/components/parameters/Reference" }]
      responses:
        "200":
          description: Tarifa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Altera nome, descrição ou valor padrão da tarifa
      description: >-
        Escopo `fees.write`. Somente as chaves presentes são alteradas; `description: null` limpa a descrição.
        Alterar o valor padrão não muda reservas, orçamentos e contratos já registrados. Com `lock_version`
        informado e diferente do atual, responde `409 stale_fee`. A rota exige o identificador.
      operationId: updateFee
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeePatch" }
      responses:
        "200":
          description: Tarifa atualizada (ou inalterada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /fees/{id}/deactivate:
    post:
      summary: Desativa tarifa
      description: >-
        Escopo `fees.write`. A tarifa deixa de ser aceita em novas reservas e orçamentos; documentos já
        registrados não mudam.
      operationId: deactivateFee
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Tarifa desativada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /fees/{id}/reactivate:
    post:
      summary: Reativa tarifa
      description: Escopo `fees.write`.
      operationId: reactivateFee
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Tarifa reativada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /customers/{id}/price-agreements:
    get:
      summary: Lista as condições negociadas do cliente
      description: >-
        Escopo `price_agreements.read`. Condições não encerradas primeiro, depois as de início mais recente.
        `product` (SKU e nome) acompanha as condições de produto somente com o escopo `catalog.read`.
      operationId: listPriceAgreements
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Página de condições negociadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceAgreementPage" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      summary: Cadastra condição negociada para o cliente
      description: >-
        Escopo `price_agreements.write`. Sem `product_id`, a condição vale para todos os produtos. Sem
        `valid_from`, vale a partir do cadastro; início até 24 horas no passado é ajustado para o instante atual.
        Vigências do mesmo cliente e escopo não se sobrepõem (`409 price_agreement_overlap`): encerre a condição
        vigente, ou agende o encerramento, antes de cadastrar a próxima. A condição não é alterada depois de criada.
      operationId: createPriceAgreement
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceAgreementInput" }
      responses:
        "201":
          description: Condição cadastrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceAgreement" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /price-agreements/{id}/end:
    post:
      summary: Encerra condição negociada (imediatamente ou em instante agendado)
      description: >-
        Escopo `price_agreements.write`. O encerramento é único: condição já encerrada, com encerramento agendado
        ou expirada responde `409 invalid_transition`. Reservas e orçamentos já registrados não mudam.
      operationId: endPriceAgreement
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceAgreementEnd" }
      responses:
        "200":
          description: Condição com o encerramento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceAgreement" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        Token `lcn_<organização>_<segredo>` criado em Usuários e permissões, com escopos e validade. Somente
        credenciais do tipo `api` de organização ativa são aceitas; credenciais da CLI operacional (tipo `cli`)
        e de organização suspensa ou encerrada recebem 401.
    session:
      type: apiKey
      in: cookie
      name: locentra_session
      description: >-
        Sessão de usuário da interface web (cookie `locentra_session`; em produção, com cookies seguros, o nome é
        `__Host-locentra`). Aceita somente em `PATCH /organization/settings`, com `X-CSRF-Token`.
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token CSRF da sessão (o campo `_csrf` das páginas da interface web); obrigatório nas mutações por sessão
      schema: { type: string }
    Reference:
      name: id
      in: path
      required: true
      description: Identificador (UUID) ou código do recurso
      schema: { type: string, maxLength: 64 }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9_.:-]+$" }
  responses:
    Error:
      description: Erro estruturado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Money:
      type: object
      properties:
        amount_cents: { type: integer }
        currency: { type: string, enum: [BRL] }
        formatted: { type: string, example: "R$ 1.234,56" }
    Period:
      type: object
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
        next_offset: { type: [integer, "null"] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, request_id]
          properties:
            code: { type: string, example: unavailable }
            message: { type: string }
            details:
              type: object
              description: >-
                `fields` nos erros de validação (campo → lista de mensagens) e `shortages` na indisponibilidade
                (`unavailable`); vazio nos demais erros.
            request_id: { type: string }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, description: Identificador da organização (não muda) }
        time_zone: { type: string, example: America/Sao_Paulo, description: Fuso horário IANA da organização }
        time_zone_label: { type: string, example: "Brasília (SP, RJ, MG, ES, PR, SC, RS, GO, DF)" }
        status: { type: string, enum: [active, suspended, closed] }
        lock_version: { type: integer, description: Versão das configurações (controle otimista da interface web) }
        settings: { $ref: "#/components/schemas/OrganizationSettings" }
        branches: { type: array, items: { $ref: "#/components/schemas/Branch" } }
    OrganizationSettings:
      type: object
      properties:
        hold_minutes: { type: integer, minimum: 5, maximum: 1440, description: Validade padrão do bloqueio temporário em minutos }
        hold_minutes_default: { type: boolean, description: Verdadeiro quando a validade é a padrão do sistema (30 minutos) }
        hold_minutes_limits:
          type: object
          properties:
            min: { type: integer, example: 5 }
            max: { type: integer, example: 1440 }
        cancellation_policy: { $ref: "#/components/schemas/CancellationPolicy" }
        cancellation_policy_default: { type: boolean, description: Verdadeiro quando a política é a padrão do sistema }
        cancellation_terms:
          type: array
          description: Texto de cada faixa, da maior para a menor antecedência
          items: { type: string }
    CancellationPolicy:
      type: object
      description: >-
        Faixas ordenadas da maior para a menor antecedência (de 1 a 6, uma delas de 0 h). A multa da faixa vale da
        antecedência informada até a faixa seguinte e não diminui à medida que o início se aproxima.
      properties:
        tiers: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/CancellationTier" } }
    CancellationTier:
      type: object
      properties:
        min_hours_before: { type: integer, minimum: 0, maximum: 8760, description: Antecedência mínima em horas inteiras }
        fee_bps: { type: integer, minimum: 0, maximum: 10000, description: Multa em pontos-base sobre o valor contratado }
    Branch:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: Código da filial (não muda) }
        name: { type: string }
        address: { type: [string, "null"] }
        active: { type: boolean }
        deactivated_at: { type: [string, "null"], format: date-time }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [individual, company] }
        name: { type: string }
        document: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        status: { type: string }
    CustomerPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        tracking: { type: string, enum: [serialized, bulk, kit] }
        buffer_before_minutes: { type: integer }
        buffer_after_minutes: { type: integer }
        deposit: { $ref: "#/components/schemas/Money" }
        pricing: { type: object }
        active: { type: boolean }
    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: R-000001 }
        status: { type: string, enum: [requested, held, confirmed, in_progress, completed, cancelled, expired] }
        source: { type: string }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        period: { $ref: "#/components/schemas/Period" }
        hold_expires_at: { type: [string, "null"], format: date-time }
        total: { $ref: "#/components/schemas/Money" }
        deposit: { $ref: "#/components/schemas/Money" }
        version: { type: integer }
        items:
          type: array
          description: Itens com o snapshot de preço da linha (presente no detalhe)
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              sku: { type: string }
              quantity: { type: integer }
              pricing: { $ref: "#/components/schemas/ReservationItemPricing" }
        allocations:
          type: object
          description: Alocações ativas da reserva (presente no detalhe)
          properties:
            assets:
              type: array
              description: Ativos serializados alocados
              items:
                type: object
                properties:
                  asset_id: { type: string, format: uuid }
                  tag: { type: string, description: Patrimônio do ativo }
            stock:
              type: array
              description: Quantidades alocadas de produtos controlados por quantidade
              items:
                type: object
                properties:
                  product_id: { type: string, format: uuid }
                  quantity: { type: integer }
        pricing: { $ref: "#/components/schemas/ReservationPricing" }
        adjustments:
          type: array
          description: Ajustes de valor registrados depois da criação, em ordem cronológica (presente no detalhe)
          items: { $ref: "#/components/schemas/ReservationAdjustment" }
        cancellation_policy:
          description: Política de cancelamento congelada na criação da reserva (presente no detalhe)
          allOf: [{ $ref: "#/components/schemas/CancellationPolicy" }]
    ReservationAdjustment:
      type: object
      properties:
        id: { type: string, format: uuid }
        reservation_item_id: { type: [string, "null"], format: uuid, description: Item ao qual o ajuste se refere; nulo quando vale para a reserva }
        kind: { type: string, enum: [extension, amendment, late_fee, damage, missing, cancellation_fee] }
        amount_cents: { type: integer, description: Valor do ajuste; negativo reduz o total }
        details: { type: object, description: Dados do ajuste conforme o tipo }
        created_at: { type: string, description: "Instante do registro em UTC, no formato `2026-03-02 12:00:00 +0000` (não ISO 8601)" }
    ReservationItemPricing:
      type: object
      description: >-
        Snapshot de preço da linha, congelado na criação. `total_cents` já descontou as faixas de quantidade e a
        condição negociada. Linhas anteriores ao cadastro de condições comerciais podem não ter
        `negotiated_agreement_id`.
      properties:
        product_id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        tracking: { type: string, enum: [serialized, bulk, kit] }
        description: { type: string, description: "Unidades cobradas, por exemplo \"2 diárias (24 h)\"" }
        table: { type: object, description: Tabela de preços do produto no instante da precificação }
        units:
          type: object
          description: >-
            Unidades cobradas, conforme a tabela: `minutes` (minutos, na cobrança por hora), `days` (diárias ou dias de
            calendário), `weeks` (semanas) e `rest_days` (dias além das semanas completas, quando a tabela tem diária e
            semanal)
        quantity: { type: integer }
        unit_amount_cents: { type: integer }
        gross_cents: { type: integer }
        tier_discount_bps: { type: integer }
        tier_discount_cents: { type: integer }
        negotiated_agreement_id: { type: [string, "null"], format: uuid, description: Condição negociada aplicada à linha }
        negotiated_discount_bps: { type: integer }
        negotiated_discount_cents: { type: integer }
        total_cents: { type: integer }
        deposit_unit_cents: { type: integer }
    ReservationPricing:
      type: object
      description: >-
        Resumo de preços congelado na criação da reserva (presente no detalhe). Vale
        `subtotal_cents - coupon_discount_cents - manual_discount_cents + fees_cents = total_cents`; o subtotal já
        considera as faixas de quantidade e as condições negociadas. Reservas anteriores ao cadastro de condições
        comerciais podem não ter `coupon` e `agreements`.
      properties:
        subtotal_cents: { type: integer }
        coupon_code: { type: [string, "null"] }
        coupon_discount_cents: { type: integer }
        manual_discount_bps: { type: integer }
        manual_discount_cents: { type: integer }
        fees_cents: { type: integer }
        total_cents: { type: integer }
        deposit_cents: { type: integer }
        period: { $ref: "#/components/schemas/Period" }
        timezone: { type: string, example: America/Sao_Paulo, description: Fuso da organização usado no cálculo das unidades }
        priced_at: { type: string, format: date-time, description: Instante da precificação (vigência de cupons e condições) }
        coupon:
          type: [object, "null"]
          description: Cupom aplicado, como estava no instante da precificação
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            kind: { type: string, enum: [percent, fixed] }
            value: { type: integer, description: Pontos-base (percent) ou centavos (fixed) }
            description: { type: [string, "null"] }
            valid_from: { type: [string, "null"], format: date-time }
            valid_until: { type: [string, "null"], format: date-time }
        agreements:
          type: array
          description: Condições negociadas aplicadas aos itens (cada item informa `negotiated_agreement_id` no próprio snapshot)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              scope: { type: string, enum: [general, product] }
              product_id: { type: [string, "null"], format: uuid }
              discount_bps: { type: integer }
              valid_from: { type: string, format: date-time }
              valid_until: { type: [string, "null"], format: date-time }
              ended_at: { type: [string, "null"], format: date-time }
        fees:
          type: array
          description: Tarifas adicionais aplicadas
          items:
            type: object
            properties:
              fee_id: { type: [string, "null"], format: uuid, description: Nulo em tarifa avulsa }
              code: { type: [string, "null"] }
              description: { type: string, description: Nome da tarifa do catálogo ou texto da tarifa avulsa }
              amount_cents: { type: integer }
              default_amount_cents: { type: [integer, "null"], description: Valor padrão da tarifa na criação; nulo em tarifa avulsa }
              source: { type: string, enum: [catalog, custom] }
    ReservationFee:
      description: >-
        Tarifa do catálogo (`fee_id`, com `amount_cents` opcional) ou tarifa avulsa (`description` e `amount_cents`);
        `fee_id` e `description` juntos são recusados (422). Chave com valor nulo vale como ausente, e as demais chaves
        (`code`, `source`, `default_amount_cents`) são ignoradas. Das entradas devolvidas em `pricing.fees`, somente a
        entrada avulsa pode ser reenviada como está (`fee_id` nulo). A entrada do catálogo traz `description` com o nome
        da tarifa e deve ser reenviada só com `fee_id` e, para manter um valor ajustado, `amount_cents`; sem o valor,
        vale o padrão vigente.
      oneOf:
        - type: object
          required: [fee_id]
          properties:
            fee_id: { type: string, format: uuid }
            amount_cents: { type: integer, minimum: 1, description: "Sem o campo, vale o valor padrão; valor diferente exige `fees.override`" }
        - type: object
          required: [description, amount_cents]
          properties:
            description: { type: string, minLength: 2, maxLength: 120 }
            amount_cents: { type: integer, minimum: 1 }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [receivable, deposit] }
        receivable_id: { type: [string, "null"], format: uuid }
        deposit_id: { type: [string, "null"], format: uuid }
        reservation_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        method: { type: string, enum: [pix, boleto, card, cash, transfer] }
        provider: { type: string, enum: [manual, simulator, asaas] }
        status: { type: string, enum: [pending_submission, submission_unknown, pending, confirmed, failed, cancelled] }
        amount: { $ref: "#/components/schemas/Money" }
        external_reference: { type: string, description: Referência estável enviada ao provedor (igual ao id) }
        provider_payment_id: { type: [string, "null"] }
