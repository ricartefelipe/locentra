        amount: { $ref: "#/components/schemas/Money" }
        reason: { type: string }
        confirmed_at: { type: [string, "null"], format: date-time }
    Coupon:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: BEMVINDO10 }
        description: { type: [string, "null"] }
        kind: { type: string, enum: [percent, fixed] }
        discount_bps: { type: [integer, "null"], description: "Desconto percentual em pontos-base (1000 = 10%); nulo em cupom de valor fixo" }
        discount:
          description: Desconto de valor fixo; nulo em cupom percentual
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        valid_from: { type: [string, "null"], format: date-time, description: Início da vigência (inclusivo); nulo vale imediatamente }
        valid_until: { type: [string, "null"], format: date-time, description: Fim da vigência (exclusivo); nulo é sem prazo }
        max_redemptions: { type: [integer, "null"] }
        redemptions: { type: integer, description: Usos ativos (reservas não canceladas nem expiradas e usos anteriores à versão 1.1.0) }
        total_redemptions: { type: integer, description: "Todos os usos registrados, inclusive os liberados" }
        remaining: { type: [integer, "null"], description: Usos restantes; nulo sem limite }
        min_subtotal: { $ref: "#/components/schemas/Money" }
        active: { type: boolean }
        status: { type: string, enum: [active, scheduled, expired, exhausted, inactive] }
        lock_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CouponInput:
      type: object
      required: [code, kind]
      description: Informe exatamente um entre `discount_bps` (tipo `percent`) e `discount_cents` (tipo `fixed`).
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,39}$", description: Convertido para maiúsculas; não use o formato de UUID }
        kind: { type: string, enum: [percent, fixed] }
        discount_bps: { type: integer, minimum: 1, maximum: 10000 }
        discount_cents: { type: integer, minimum: 1 }
        description: { type: [string, "null"], maxLength: 200 }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time, description: Posterior ao início e ao instante atual }
        max_redemptions: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        min_subtotal_cents: { type: [integer, "null"], minimum: 0, description: Subtotal mínimo da reserva depois das faixas e das condições negociadas }
    CouponPatch:
      type: object
      properties:
        description: { type: [string, "null"], maxLength: 200 }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        max_redemptions: { type: [integer, "null"], minimum: 1, maximum: 1000000, description: Não pode ficar abaixo dos usos ativos }
        min_subtotal_cents: { type: [integer, "null"], minimum: 0 }
        lock_version: { type: integer, minimum: 1, description: "Versão lida pelo cliente (controle otimista, opcional)" }
    CouponPage:
      type: object
