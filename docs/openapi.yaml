      required: [fee_bps, fee, base, hours_before]
      properties:
        fee_bps: { type: integer, minimum: 0, maximum: 10000 }
        fee: { $ref: "#/components/schemas/Money" }
        base: { $ref: "#/components/schemas/Money" }
        hours_before: { type: integer, description: Horas inteiras até o início (negativo depois dele) }
    ContractAmendmentResult:
      type: object
      additionalProperties: false
      required: [contract, amendment]
      properties:
        contract: { $ref: "#/components/schemas/Contract" }
        amendment: { $ref: "#/components/schemas/ContractAmendment" }
    ContractCancellationResult:
      type: object
      additionalProperties: false
      required: [contract, cancellation]
      properties:
        contract: { $ref: "#/components/schemas/Contract" }
        cancellation: { $ref: "#/components/schemas/ContractCancellationPreview" }
    ContractIssueInput:
      type: object
      required: [reservation_id]
      properties:
        reservation_id: { type: string, format: uuid }
        conditions: { type: [string, "null"], maxLength: 5000, description: "Condições específicas; sem o campo, valem as da versão aprovada do orçamento" }
    ContractAmendmentInput:
      type: object
      required: [ends_at]
      properties:
        ends_at: { type: string, format: date-time, description: Novo fim da reserva }
        description: { type: [string, "null"], maxLength: 1000 }
    ReservationLink:
      type: object
      additionalProperties: false
      required: [id, code, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [requested, held, confirmed, in_progress, completed, cancelled, expired] }
    Pickup:
      type: object
      additionalProperties: false
      required: [id, status, reservation, branch_id, picker, notes, started_at, delivered_at, cancelled_at, version, lines, authorized_pickers]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [picking, delivered, cancelled] }
        reservation: { $ref: "#/components/schemas/ReservationLink" }
        branch_id: { type: string, format: uuid }
        picker:
          description: Quem retirou (nulo antes da entrega)
          oneOf: [{ $ref: "#/components/schemas/PickupPicker" }, { type: "null" }]
        notes: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
        lines: { type: array, items: { $ref: "#/components/schemas/PickupLine" } }
        authorized_pickers:
          type: [array, "null"]
          description: Contatos do cliente autorizados a retirar; nulo sem o escopo `customers.read`
          items:
            type: object
            additionalProperties: false
            required: [contact_id, name]
            properties:
              contact_id: { type: string, format: uuid }
              name: { type: string }
    PickupLine:
      type: object
      additionalProperties: false
      required: [id, status, product_id, sku, reservation_item_id, asset_id, tag, allocated_asset_id, allocated_tag, expected_quantity, checked_quantity,
                 delivered_quantity, returned_quantity, missing_quantity, release_reason]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, checked, delivered, partial, not_delivered, cancelled] }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        reservation_item_id: { type: string, format: uuid }
        asset_id: { type: [string, "null"], format: uuid, description: Ativo da linha (o conferido depois da conferência) }
        tag: { type: [string, "null"], description: Patrimônio do ativo da linha }
        allocated_asset_id: { type: [string, "null"], format: uuid, description: Ativo alocado à reserva }
        allocated_tag: { type: [string, "null"] }
        expected_quantity: { type: integer }
        checked_quantity: { type: integer }
        delivered_quantity: { type: integer }
        returned_quantity: { type: integer }
        missing_quantity: { type: integer }
        release_reason: { type: [string, "null"], description: Motivo da liberação da quantidade não entregue }
    PickupPicker:
      type: object
      additionalProperties: false
      required: [kind, contact_id, name]
      properties:
        kind: { type: string, enum: [customer, contact] }
        contact_id: { type: [string, "null"], format: uuid }
        name: { type: string }
    PickupCheckInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                required: [line_id, tag]
                properties:
                  line_id: { type: string, format: uuid }
                  tag: { type: string, description: Patrimônio conferido }
              - type: object
                required: [line_id, quantity]
                properties:
                  line_id: { type: string, format: uuid }
                  quantity: { type: integer, minimum: 0, description: Quantidade conferida (0 volta a linha para pendente) }
    PickupDeliverInput:
      type: object
      required: [picker]
      properties:
        picker:
          oneOf:
            - type: object
              required: [kind]
              properties:
                kind: { type: string, const: customer, description: Cliente pessoa física }
            - type: object
              required: [kind, contact_id]
              properties:
                kind: { type: string, const: contact, description: Contato autorizado a retirar }
                contact_id: { type: string, format: uuid }
        notes: { type: [string, "null"], maxLength: 1000 }
    ReturnItems:
      type: object
      additionalProperties: false
      required: [reservation, pickup_id, lines, returns]
      properties:
        reservation: { $ref: "#/components/schemas/ReservationLink" }
        pickup_id: { type: [string, "null"], format: uuid, description: Retirada entregue (nula antes da entrega) }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, status, product_id, sku, reservation_item_id, asset_id, tag, allocated_asset_id, allocated_tag, expected_quantity, checked_quantity,
                 delivered_quantity, returned_quantity, missing_quantity, release_reason,
                       pending_quantity]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [pending, checked, delivered, partial, not_delivered, cancelled] }
              product_id: { type: string, format: uuid }
              sku: { type: string }
              reservation_item_id: { type: string, format: uuid }
              asset_id: { type: [string, "null"], format: uuid, description: Ativo da linha (o conferido depois da conferência) }
              tag: { type: [string, "null"], description: Patrimônio do ativo da linha }
              allocated_asset_id: { type: [string, "null"], format: uuid, description: Ativo alocado à reserva }
              allocated_tag: { type: [string, "null"] }
              expected_quantity: { type: integer }
              checked_quantity: { type: integer }
              delivered_quantity: { type: integer }
              returned_quantity: { type: integer }
              missing_quantity: { type: integer }
              release_reason: { type: [string, "null"], description: Motivo da liberação da quantidade não entregue }
              pending_quantity: { type: integer, description: Entregue menos devolvido e faltante }
        returns:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, returned_at, late_fee, completes_reservation, lines]
            properties:
              id: { type: string, format: uuid }
              returned_at: { type: string, format: date-time }
              late_fee: { $ref: "#/components/schemas/Money" }
              completes_reservation: { type: boolean }
              lines: { type: integer, description: Quantidade de itens da devolução }
    Return:
      type: object
      additionalProperties: false
      required: [id, reservation_id, reservation_code, pickup_id, returned_at, late_fee, completes_reservation, notes, lines, late_fees]
      properties:
        id: { type: string, format: uuid }
        reservation_id: { type: string, format: uuid }
        reservation_code: { type: string }
        pickup_id: { type: string, format: uuid }
        returned_at: { type: string, format: date-time }
        late_fee: { $ref: "#/components/schemas/Money" }
        completes_reservation: { type: boolean }
        notes: { type: [string, "null"] }
        lines: { type: array, items: { $ref: "#/components/schemas/ReturnLine" } }
        late_fees: { type: array, items: { $ref: "#/components/schemas/ReturnLateFee" } }
    ReturnLine:
      type: object
      additionalProperties: false
      required: [id, pickup_line_id, outcome, quantity, requires_inspection, notes, asset_id, stock_pool_id, sku, tag, damage_report_id,
                 damage_report_code]
      properties:
        id: { type: string, format: uuid }
        pickup_line_id: { type: string, format: uuid }
        outcome: { type: string, enum: [ok, damaged, missing] }
        quantity: { type: integer, minimum: 1 }
        requires_inspection: { type: boolean }
        notes: { type: [string, "null"] }
        asset_id: { type: [string, "null"], format: uuid }
        stock_pool_id: { type: [string, "null"], format: uuid }
        sku: { type: string }
        tag: { type: [string, "null"] }
        damage_report_id: { type: [string, "null"], format: uuid, description: Registro de avaria ou falta aberto pela devolução }
        damage_report_code: { type: [string, "null"] }
    ReturnLateFee:
      type: object
      additionalProperties: false
      required: [reservation_item_id, amount, quantity]
      properties:
        reservation_item_id: { type: [string, "null"], format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        quantity: { type: [integer, "null"] }
    ReturnInput:
      type: object
      required: [entries]
      properties:
        entries: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ReturnEntry" } }
        notes: { type: [string, "null"], maxLength: 1000 }
    ReturnEntry:
      type: object
      required: [pickup_line_id, outcome]
      properties:
        pickup_line_id: { type: string, format: uuid }
        outcome: { type: string, enum: [ok, damaged, missing] }
        quantity: { type: integer, minimum: 1, default: 1 }
        requires_inspection: { type: boolean, default: false, description: "Avaria sempre exige inspeção; falta nunca" }
        notes: { type: [string, "null"], maxLength: 1000, description: Obrigatório em avaria e falta (ao menos 3 caracteres) }
    Inspection:
      type: object
      additionalProperties: false
      required: [id, status, reason, product_id, branch_id, asset_id, stock_pool_id, quantity, reservation_id, return_line_id, maintenance_order_id,
                 created_at, decided_at, decision_notes]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        product_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        asset_id: { type: [string, "null"], format: uuid }
        stock_pool_id: { type: [string, "null"], format: uuid }
        quantity: { type: integer, minimum: 1 }
        reservation_id: { type: [string, "null"], format: uuid }
        return_line_id: { type: [string, "null"], format: uuid }
        maintenance_order_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decision_notes: { type: [string, "null"] }
    InspectionPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Inspection" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    InspectionRejection:
      type: object
      additionalProperties: false
      required: [inspection, maintenance_order]
      properties:
        inspection: { $ref: "#/components/schemas/Inspection" }
        maintenance_order:
          type: object
          additionalProperties: false
          required: [id, code]
          properties:
            id: { type: string, format: uuid }
            code: { type: string, example: OM-000001 }
    Alert:
      type: object
      additionalProperties: false
      required: [id, kind, status, reservation_id, related_reservation_id, asset_id, stock_pool_id, details, created_at, resolved_at, resolution]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [overdue, affected_by_overdue, asset_unavailable] }
        status: { type: string, enum: [open, resolved] }
        reservation_id: { type: string, format: uuid }
        related_reservation_id: { type: [string, "null"], format: uuid, description: "Reserva de origem (por exemplo, a reserva em atraso)" }
        asset_id: { type: [string, "null"], format: uuid }
        stock_pool_id: { type: [string, "null"], format: uuid }
        details: { type: object, description: "Dados do alerta conforme o tipo (código da reserva, fim previsto, patrimônio)" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        resolution: { type: [string, "null"] }
    AlertPage:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Alert" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    OrganizationSettingsPatch:
      type: object
      additionalProperties: false
      required: [lock_version]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        time_zone: { type: string, example: America/Manaus, description: Fuso IANA da lista do Brasil (o atual é sempre aceito) }
        hold_minutes: { type: integer, minimum: 5, maximum: 1440 }
        cancellation_policy:
          type: object
          additionalProperties: false
          required: [tiers]
          properties:
            tiers: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/CancellationTier" } }
        confirm_time_zone_change: { type: boolean, default: false, description: Obrigatório (true) para trocar o fuso }
        lock_version: { type: integer, minimum: 1, description: Versão atual das configurações (`lock_version` de `GET /organization`) }
    OrganizationSettingsResult:
      type: object
      additionalProperties: false
      required: [organization, changed]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        changed: { type: boolean, description: Falso quando os valores enviados já eram os atuais (nada gravado nem auditado) }
