plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "coverage/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Documentação de classes fica nos comentários de cabeçalho e em docs/; não exigimos em cada classe.
Style/Documentation:
  Enabled: false

# Textos de interface e mensagens estão em português, incluindo acentuação.
Style/AsciiComments:
  Enabled: false

# Linhas que abrem heredocs SQL carregam a lista de parâmetros posicionais ($1, $2, ...) na mesma
# linha para manter a correspondência visível com o SQL.
Layout/LineLength:
  Max: 160
  AllowedPatterns:
    - '<<~SQL'


Metrics/MethodLength:
  Max: 30
  CountAsOne: ["array", "hash", "heredoc", "method_call"]
  Exclude:
    - "lib/locentra/system.rb"

Metrics/ClassLength:
  Max: 300
  CountAsOne: ["array", "hash", "heredoc", "method_call"]

Metrics/ModuleLength:
  Max: 300
  CountAsOne: ["array", "hash", "heredoc", "method_call"]

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 8
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "Rakefile"

Naming/MethodParameterName:
  AllowedNames: ["id", "to", "at", "a", "b", "io", "tx", "db", "ip", "by"]

Naming/PredicateMethod:
  Enabled: false

Minitest/MultipleAssertions:
  Max: 12

Minitest/AssertTruthy:
  Enabled: false

# O composition root é uma sequência de construtores explícitos; métricas de complexidade não se
# aplicam a ele de forma útil.
Metrics/AbcSize:
  Max: 50
  Exclude:
    - "test/**/*"
    - "lib/locentra/system.rb"

Minitest/TestFileName:
  Exclude:
    - "test/**/*_helper.rb"
    - "test/support/**/*"
